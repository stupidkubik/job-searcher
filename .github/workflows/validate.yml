name: validate

on:
  push:
    branches: [main, codex/restructure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reject-request-prs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject operation requests delivered via pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- data/operations/requests/)"
          if [[ -n "$changed" ]]; then
            echo "this delivery path is not supported: commit the request directly to main" >&2
            echo "$changed" >&2
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Проверка схемы jobs.csv
        run: python scripts/jobs.py validate --strict
      - name: Проверка актуальности browser tracker
        run: python scripts/jobs.py render-tracker --check
      - name: Проверка актуальности operation field contract
        run: python scripts/agent_operations.py render-contract --check
      - name: Unit tests write-path
        run: python -m unittest discover -s tests -v
      - name: Поиск дублей (не блокирует)
        run: python scripts/jobs.py dupes --fail
        continue-on-error: true
