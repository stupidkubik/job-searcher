name: agent operations

on:
  push:
    branches: [main]
    paths:
      - "data/operations/requests/*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "Existing request path on main"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apply:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    concurrency:
      group: agent-operation-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require main
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != main ]]; then
            echo "agent operations may run only on main" >&2
            exit 1
          fi

      - name: Reject merge commits
        if: github.event_name == 'push'
        run: |
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          if [[ "${#parents[@]}" -gt 2 ]]; then
            echo "this delivery path is not supported: commit the request directly to main" >&2
            exit 1
          fi

      - name: Find the one new request
        id: request
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              sys.exit("main request needs a valid push base SHA")
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True,
          ).splitlines()
          pattern = re.compile(r"data/operations/requests/[a-z0-9][a-z0-9._-]{2,79}\.json\Z")
          if len(changed) != 1 or not pattern.fullmatch(changed[0]):
              sys.exit("main must add exactly one data/operations/requests/<operation-id>.json file")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={changed[0]}\n")
          PY

      - name: Accept a manually selected existing request
        id: dispatch_request
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUEST_INPUT: ${{ inputs.request }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          path = os.environ["REQUEST_INPUT"]
          if not re.fullmatch(r"data/operations/requests/[a-z0-9][a-z0-9._-]{2,79}\.json", path):
              sys.exit("request must be data/operations/requests/<operation-id>.json")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={path}\n")
          PY

      - name: Ensure the branch contains only its request
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path || steps.dispatch_request.outputs.path }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          expected = os.environ["REQUEST_PATH"]
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              sys.exit(0)
          base = os.environ["BASE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              sys.exit("main request needs a valid push base SHA")
          changed = subprocess.check_output(
              ["git", "diff", "--name-status", base, "HEAD"], text=True,
          ).splitlines()
          if changed != [f"A\t{expected}"]:
              sys.exit("main may add exactly one new operation request before execution")
          PY

      - name: Apply the declarative operation and push the audited result
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path || steps.dispatch_request.outputs.path }}
        run: scripts/ci/apply_operation.sh "$REQUEST_PATH"
